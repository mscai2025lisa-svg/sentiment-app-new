<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sentiment Analysis</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: 60px auto;
    text-align: center;
    background: #f5f5f5;
  }
  textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    margin-top: 15px;
    padding: 10px 25px;
    font-size: 16px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #result {
    margin-top: 25px;
    padding: 15px;
    border-radius: 6px;
    font-size: 18px;
    min-height: 20px;
  }
  .positive { background: #dcfce7; color: #166534; }
  .negative { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>

  <h1>Sentiment Analysis</h1>
  <p>Type a sentence and click Analyze to see if it's positive or negative.</p>

  <textarea id="userText" placeholder="Type your text here..."></textarea><br>
  <button onclick="getPrediction()">Analyze</button>

  <div id="result"></div>

<script>
async function getPrediction() {
  const text = document.getElementById("userText").value;
  const resultDiv = document.getElementById("result");

  if (!text.trim()) {
    resultDiv.className = "";
    resultDiv.innerText = "Please type something first.";
    return;
  }

  resultDiv.className = "";
  resultDiv.innerText = "Analyzing...";

  try {
    const response = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });

    const data = await response.json();

    resultDiv.className = data.label === "Positive" ? "positive" : "negative";
    resultDiv.innerText = `${data.label} (confidence: ${(data.confidence * 100).toFixed(1)}%)`;

  } catch (err) {
    resultDiv.className = "";
    resultDiv.innerText = "Error contacting server. Try again.";
    console.error(err);
  }
}
</script>

</body>
</html>
